# ResearchGPT — default run configuration
#
# Typed by src/researchgpt/core/models.py::RunConfig. Unknown keys are rejected.
#
# NOTE: this file deliberately does NOT follow RESEARCHGPT_SPEC.md §10.1's
# `llm:` block. That block names gpt-4o-mini and gpt-4o, which are forbidden
# under TASKLIST §0.1 ($0, free open-weight models only). The spec's config
# predates the zero-budget constraint.
#
# T-004 BAKE-OFF: COMPLETE (2026-08-25). 5 real gold-set abstracts per arm,
# through the real extractor_v1 prompt and the real LLMClient.
#
#   arm                   parse valid fields echo   avg lat   verdict
#   openai/gpt-oss-120b    100%  100%  4.6/8    0     26.6s   PRIMARY
#   qwen/qwen3.6-27b       100%  100%  7.0/8  2/5     41.8s   rejected
#   gemma-4-31b-it            -     -      -    -         -   disqualified
#   gemma-4-26b-a4b-it        -     -      -    -         -   disqualified
#
# WHY gpt-oss WINS DESPITE LOWER FIELD COVERAGE:
#   qwen echoed the literal schema placeholder "string" into datasets/metrics
#   on 2 of 5 papers (40%). That is the worst possible failure mode here: it
#   parses, it validates, and it silently injects fabricated content into a
#   hallucination-graded pipeline (SPEC §14.2 forbids exactly this).
#   qwen's 7.0/8 field score is itself INFLATED by the echo - excluding the
#   echoed rows it scores 6.33/8. gpt-oss echoed 0/5.
#
# KNOWN WEAKNESS OF THE WINNER: gpt-oss populates only 4.6/8 content fields.
#   This is most likely a PROMPT problem, not a model problem - extractor_v1
#   ships 3 few-shot examples and Dagdelen et al. measured structured output
#   stabilising at ~20. T-404 must expand the few-shots, then re-run this
#   bake-off and expect the field count to rise.
#
# LATENCY REALITY CHECK (TASKLIST §0.2 tolerance is ~30 min/run):
#   gpt-oss ~26.6s/paper x ~70 papers = ~31 min for the extraction stage
#   alone. Right at the tolerance. The response cache makes re-runs free, but
#   the FIRST full run will sit near 30-40 min end to end.
#   Groq latency is highly variable under load (measured 3.8s-55s same arm).

llm:
  # SWITCHED 120b -> 20b on 2026-08-28, mid-T-409, because the 120b DAILY token
  # budget ran out. Not a quality decision - a quota one.
  #
  #     Rate limit reached for openai/gpt-oss-120b ... on tokens per day (TPD):
  #     Limit 200000, Used 197751, Requested 5520. Try again in 23m33s.
  #
  # ⚠️ TPD is INVISIBLE IN THE HEADERS. x-ratelimit-limit-tokens /
  # x-ratelimit-remaining-tokens report only the per-MINUTE bucket, and they
  # read a healthy 8000/8000 while the daily bucket was empty. The daily limit
  # appears ONLY in the body of a 429. Diagnosing this from headers alone sent
  # us down a tokens-per-minute rabbit hole; read an actual 429 body next time.
  #
  # TPD is per-MODEL, not per-organisation - measured 2026-08-28: 120b refused
  # while 20b and qwen3.6-27b both served the same 4,250-token request. So the
  # switch buys a fresh 200,000-token budget.
  #
  # ⚠️ T-004 BAKE-OFF DID NOT COVER 20b. TASKLIST 0.1 lists it as "not yet
  # probed", and this run adopts it without the 5-paper probe (a deliberate
  # call, to get the flagship survey today rather than tomorrow). CHECK THE
  # OUTPUT: watch field coverage against 120b's measured 4.6/8, and watch for
  # the placeholder-echo failure that disqualified qwen - the literal string
  # "string" appearing in datasets/metrics. If either shows up, this model is
  # not usable for a hallucination-graded deliverable.
  #
  # qwen/qwen3.6-27b also has budget but stays REJECTED: T-004 measured it
  # echoing schema placeholders into datasets/metrics on 2 of 5 papers, which
  # silently injects fabricated content (SPEC 14.2 forbids exactly this).
  #
  # Restore 120b once its daily window refills, if the two runs are comparable.
  model: openai/gpt-oss-20b        # Extractor / Critic / Writer
  planner_model: openai/gpt-oss-20b    # Planner
  temperature: 0.1
  # 4096 -> 2048. Measured over 55 cached extractions: median response 571
  # tokens, p90 948, max 1,682. 4096 reserved 2.4x the largest response ever
  # produced, and that reservation is charged against TPM. Agents override:
  # extractor 2,048, writer 2,560 (prose sections need more than JSON).
  max_tokens: 2048
  # GROQ FREE-TIER LIMITS, verified live 2026-08-28 against
  # x-ratelimit-* headers and console.groq.com/docs/rate-limits.
  # Identical for openai/gpt-oss-120b, openai/gpt-oss-20b and qwen/qwen3.6-27b:
  #
  #     RPM     30          requests per minute
  #     RPD  1,000          requests per DAY
  #     TPM  8,000          tokens per minute   <-- THE ONE THAT BINDS
  #     TPD 200,000         tokens per day
  #
  # T-409 was refused constantly while holding 999 of 1,000 daily requests.
  # This project is token-bound, not request-bound, and the throttle used to
  # pace only requests - which is why lowering it 15 -> 4 changed nothing.
  #
  # Providers reserve `prompt + max_tokens` against the TPM bucket at
  # admission. With the old max_tokens 4096 and extractor prompts up to 18,000
  # chars (~4,500 tokens), the largest requests reserved ~8,600 tokens - more
  # than the entire bucket - so they could never be served at ANY rate. They
  # burned 5 retries x 60 s each and were written as blank insights.
  #
  # Now: llm.py estimates prompt+max_tokens, refuses an impossible request
  # immediately with TokenBudgetExceeded, and paces on a rolling 60 s token
  # ledger. requests_per_minute returns to Groq's real 30; tokens govern.
  requests_per_minute: 30
  tokens_per_minute: 8000
  # ★ gpt-oss are REASONING models. max_tokens budgets the reasoning trace AND
  # the visible answer together, so at the provider's default effort the trace
  # can eat the whole budget and return EMPTY content.
  #
  # Measured 2026-08-28, real 4,488-token extractor prompt on gpt-oss-20b at
  # max_tokens=2048:
  #     default -> finish_reason "length", ~2,627 reasoning tokens, CONTENT
  #                EMPTY. The extractor then logged "No JSON object can be
  #                recovered from empty input" and burned its repair budget:
  #                38% of requests in that run were repairs.
  #     "low"   -> finish_reason "stop", 626 completion tokens, ~179 reasoning,
  #                parses first time, 6 of 8 fields filled.
  #
  # "low" is not a compromise: 6/8 beats gpt-oss-120b's measured 4.6/8, using
  # ~3x fewer tokens. Structured extraction is transcription, not reasoning.
  reasoning_effort: low
  max_retries: 5
  cache_dir: data/llm_cache        # prompt-hash cache (T-104)

embeddings:
  model: BAAI/bge-small-en-v1.5    # CPU-sized, down from bge-large
  device: cpu
  batch_size: 32

retrieval:
  dense_k: 30
  sparse_k: 30
  fusion: rrf
  rrf_k: 60
  rerank: true
  # T-335 RE-ADOPTED 2026-08-28, on the retrained model. Third and final state.
  #
  # HISTORY, because this decision moved twice and the reasons matter:
  #   2026-08-27  adopted (T-335) on in-domain + cached-pool evidence
  #   2026-08-27  REVERTED after M1: the tuned model ranked an IoT-monitoring
  #               paper above LiRA, the most relevant paper in the pool. Cause:
  #               T-331 mined 100% BM25 hard negatives, so the model was only
  #               ever asked "which plausible science abstract belongs here?"
  #               and never "is this relevant at all?" - it lost its relevance
  #               prior.
  #   2026-08-28  RETRAINED with MIXED negatives (T-332R, 3 hard : 2 random)
  #               and re-adopted. This entry.
  #
  # T-334/T-335 measured on the int8 ONNX build - i.e. what actually ships:
  #     arm          nDCG@10   Recall@20   Precision@12   relevance control
  #     stock         0.2277      0.4815         0.0926   0/15 PASS
  #     tuned         0.2425      0.5926         0.1019   0/15 PASS
  #     delta        +0.0149     +0.1111        +0.0093
  #   in-domain nDCG@10 0.2646 -> 0.6545.
  #
  # ** The relevance control now passes 0/15, against the old model's 11/15. **
  # That is the property the retrain existed to restore, and it is measured on
  # the pool the PLANNER builds - the lesson from the first reversal.
  #
  # A/B on the query M1 failed on, "multi agent retrieval literature review":
  # the new model puts 2 gold papers in the top 10 (best rank 9) where stock
  # puts 0 (best rank 39), and its top-5 is on-topic throughout. On
  # "automated literature review generation" and "scientific claim
  # verification" its top-5 is topically correct on every row, where the OLD
  # tuned model returned marketing decision-making and computational mechanics.
  #
  # WARNING - the notebook's own gate said STOP, and it was wrong.
  # T-332R's in-notebook control reported a 44% violation rate, measured on the
  # SciReviewGen DEV pool, where the median candidate is itself a BM25 hard
  # negative - so "beat the median" is a far harder bar there than on a real
  # 493-paper retrieval pool that is ~98% on-topic. The authority is T-335,
  # measured on this project's own bibliography. Do not re-revert on the
  # notebook number.
  #
  # !! CONDITION 1 STILL BINDS: this model's scores are COMPRESSED (+1..+3.7
  # !! where stock gives +9). Ordering is correct; absolute values are not
  # !! comparable to stock and must never be thresholded. hybrid_retriever
  # !! fuses by RRF over RANKS, and Reranker.filter_by_score() raises
  # !! UncalibratedScoreError on any non-stock model, which covers this one
  # !! automatically. Phase 5: if T-506's Critic ever wants a retrieval-score
  # !! cutoff, it must use the stock model or a recalibrated one.
  reranker: data/models/reranker-mixed-onnx   # T-332R int8 ONNX, 23 MB, CPU
  final_k: 12
  chunk_size: 1200
  chunk_overlap: 200

sources:
  # OpenAlex is the mandatory primary (reliable, keyless, rich venue/OA data).
  # Semantic Scholar reinstated 2026-08-25 (TASKLIST §0.2): claimed on 8 slides
  # of the Review-2 deck, and its rate limiting is survivable now that latency
  # is not a constraint. It is BEST-EFFORT — on sustained 429s the run
  # continues on openalex + arxiv. Crossref stays cut (redundant).
  # Semantic Scholar DISABLED 2026-08-27 (decision: use OpenAlex instead).
  #
  # Why: keyless it answers roughly 1 query in 3 and burns up to 60s of
  # exponential backoff on each miss (decisions.txt D-03 chose to skip the free
  # academic key). Measured on the first M1 attempt: that alone was ~16 minutes
  # of pure sleeping across a 24-task plan, and the run was killed at 10 min
  # having completed 38 of 72 source-queries.
  #
  # TASKLIST 0.2 requires "OpenAlex OR Semantic Scholar" - OpenAlex satisfies
  # it, and OpenAlex is now keyed (1,000 searches/day, 0.2) so there is ample
  # headroom without S2.
  #
  # ⚠️ The T-214 connector is NOT deleted and still passes its tests. Both decks
  # claim Semantic Scholar on 8 slides, so say "implemented and available,
  # disabled by default for latency" rather than removing the claim (T-809).
  # Re-enable by adding semantic_scholar back to this list - ideally once
  # S2_API_KEY exists (T-215), which removes the throttling entirely.
  enabled: [openalex, arxiv]
  max_per_source: 25

review:
  min_papers: 20
  # Lowered 60 -> 25 on 2026-08-28. Extraction is one sequential LLM call per
  # paper and the 6-example prompt made each slower, so 60 papers is ~60-90 min
  # against the ~30-minute tolerance in TASKLIST 0.2. 25 is also the size
  # TASKLIST already specifies for ablation runs (T-702/T-703), so the flagship
  # run and the ablations are now directly comparable rather than differently
  # sized.
  #
  # ⚠️ Consequence for T-409's recall figure: with a 35-paper answer key, the
  # CORPUS recall ceiling is 25/35 = 0.714. It cannot reach 0.80 at this
  # setting, by arithmetic, and must not be read as a retrieval failure.
  # UNION recall - did retrieval find the paper at all - is unaffected, and
  # decisions.txt D-04 already makes that the primary gate for exactly this
  # reason.
  max_papers: 25
  year_min: 2019
  max_iterations: 3                # hard cap, forced WRITE on the last
  grounding_threshold: 0.7
  coverage_threshold: 0.8

verifier:
  # CORRECTED 2026-08-28 (T-502). This named data/models/verifier-int8.onnx,
  # which has never existed - T-304 exports to a DIRECTORY. The placeholder was
  # written before the export ran and nothing loaded it until Phase 5, so it
  # sat wrong for three days.
  onnx_path: data/models/verifier-onnx
  # Kept only as a fallback. VerifierModel prefers the tokenizer saved beside
  # the checkpoint: the export writes its own, and loading a Hub tokenizer that
  # merely shares a name would score with a different vocabulary and degrade
  # silently rather than fail.
  tokenizer: microsoft/deberta-v3-small
  support_threshold: 0.7           # biased to precision (T-503)

output:
  citation_style: ieee
  formats: [markdown, csv, bibtex]
  runs_dir: outputs/runs
