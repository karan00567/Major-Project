</style><g><rect x="14" y="56" width="230" height="88" rx="10" class="arch-box-accent"></rect><text x="129" y="80" text-anchor="middle" class="arch-title">Claim + evidence</text><text x="129" y="98" text-anchor="middle" class="arch-mono">[CLS] claim [SEP] span [SEP]</text><text x="129" y="113" text-anchor="middle" class="arch-sub">≤ 256 SentencePiece tokens</text><text x="129" y="128" text-anchor="middle" class="arch-sub">vocab 128,100</text></g><g><path d="M 244 100 L 270 100" class="arch-line"></path><path d="M 270 100 L 261.6 94 L 261.6 106 Z" class="arch-arrowhead"></path></g><g><rect x="270" y="56" width="192" height="88" rx="10" class="arch-box"></rect><text x="366" y="80" text-anchor="middle" class="arch-title">Disentangled input</text><text x="366" y="98" text-anchor="middle" class="arch-sub">content embedding 768-d</text><text x="366" y="113" text-anchor="middle" class="arch-sub">relative position, 256 buckets</text><text x="366" y="128" text-anchor="middle" class="arch-sub">no absolute position added</text></g><g><path d="M 462 100 L 488 100" class="arch-line"></path><path d="M 488 100 L 479.6 94 L 479.6 106 Z" class="arch-arrowhead"></path></g><g><rect x="497" y="47" width="196" height="88" rx="10" class="arch-box" opacity="0.45"></rect><rect x="492.5" y="51.5" width="196" height="88" rx="10" class="arch-box" opacity="0.7"></rect><rect x="488" y="56" width="196" height="88" rx="10" class="arch-box"></rect><text x="586" y="80" text-anchor="middle" class="arch-title">DeBERTa-v3 encoder</text><text x="586" y="98" text-anchor="middle" class="arch-sub">12 heads · FFN 3,072</text><text x="586" y="113" text-anchor="middle" class="arch-sub">content→position and</text><text x="586" y="128" text-anchor="middle" class="arch-sub">position→content</text><g><rect x="642" y="45" width="38" height="20" rx="10" class="arch-box"></rect><text x="661" y="59" text-anchor="middle" class="arch-title" style="font-size:11px;">× 6</text></g></g><g><path d="M 684 100 L 710 100" class="arch-line"></path><path d="M 710 100 L 701.6 94 L 701.6 106 Z" class="arch-arrowhead"></path></g><g><rect x="710" y="56" width="122" height="88" rx="10" class="arch-box"></rect><text x="771" y="80" text-anchor="middle" class="arch-title">Pooler</text><text x="771" y="98" text-anchor="middle" class="arch-sub">768 · GELU</text><text x="771" y="113" text-anchor="middle" class="arch-sub">dropout 0</text></g><g><path d="M 832 100 L 858 100" class="arch-line"></path><path d="M 858 100 L 849.6 94 L 849.6 106 Z" class="arch-arrowhead"></path></g><g><rect x="858" y="56" width="128" height="88" rx="10" class="arch-box-accent"></rect><text x="922" y="80" text-anchor="middle" class="arch-title">Linear → 3</text><text x="922" y="98" text-anchor="middle" class="arch-sub">softmax</text></g><path d="M 922 144 V 186 H 234 M 430 186 V 214 M 626 186 V 214 M 234 186 V 214" class="arch-line" fill="none"></path><path d="M 234 214 L 228 202 L 240 202 Z" class="arch-arrowhead"></path><path d="M 430 214 L 424 202 L 436 202 Z" class="arch-arrowhead"></path><path d="M 626 214 L 620 202 L 632 202 Z" class="arch-arrowhead"></path><g><rect x="150" y="216" width="168" height="62" rx="10" class="arch-box-good"></rect><text x="234" y="240" text-anchor="middle" class="arch-title">SUPPORT</text><text x="234" y="258" text-anchor="middle" class="arch-sub">softmax probability</text></g><g><rect x="346" y="216" width="168" height="62" rx="10" class="arch-box-bad"></rect><text x="430" y="240" text-anchor="middle" class="arch-title">CONTRADICT</text><text x="430" y="258" text-anchor="middle" class="arch-sub">refuted by the span</text></g><g><rect x="542" y="216" width="168" height="62" rx="10" class="arch-box-warn"></rect><text x="626" y="240" text-anchor="middle" class="arch-title">NOT ENOUGH INFO</text><text x="626" y="258" text-anchor="middle" class="arch-sub">span does not decide</text></g><g><path d="M 234 278 L 234 300" class="arch-line"></path><path d="M 234 300 L 228 291.6 L 240 291.6 Z" class="arch-arrowhead"></path></g><g><rect x="150" y="302" width="168" height="54" rx="10" class="arch-box-muted"></rect><text x="234" y="326" text-anchor="middle" class="arch-title">P(SUPPORT) ≥ 0.7 ?</text><text x="234" y="344" text-anchor="middle" class="arch-sub">biased to precision</text></g><path d="M 234 356 V 374 H 288 V 390" class="arch-line" fill="none"></path><path d="M 288 390 L 282 378 L 294 378 Z" class="arch-arrowhead"></path><text x="248" y="371" class="arch-cap">yes</text><path d="M 318 329 H 670 V 390 M 430 278 V 329 M 626 278 V 329" class="arch-line" fill="none"></path><path d="M 670 390 L 664 378 L 676 378 Z" class="arch-arrowhead"></path><text x="336" y="322" class="arch-cap">no</text><g><rect x="178" y="392" width="220" height="74" rx="10" class="arch-box-good"></rect><text x="288" y="416" text-anchor="middle" class="arch-title">Kept</text><text x="288" y="434" text-anchor="middle" class="arch-sub">evidence span retained</text><text x="288" y="449" text-anchor="middle" class="arch-sub">citation attached</text></g><g><rect x="560" y="392" width="220" height="74" rx="10" class="arch-box-bad"></rect><text x="670" y="416" text-anchor="middle" class="arch-title">Dropped</text><text x="670" y="434" text-anchor="middle" class="arch-sub">logged to trace.jsonl</text><text x="670" y="449" text-anchor="middle" class="arch-sub">shown for human override</text></g></svg>