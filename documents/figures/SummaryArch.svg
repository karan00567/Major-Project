<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 458" width="1000" height="458" role="img" aria-label="BART-base architecture: a six-layer bidirectional encoder and a
                   six-layer autoregressive decoder joined by cross-attention over
                   the encoder memory."><style>
  svg { font-family: system-ui, 'Segoe UI', Roboto, sans-serif; background:#ffffff; }
  .arch-box{fill:#fff;stroke:#e3e5e9}
  .arch-box-muted{fill:#eff1f5;stroke:#e3e5e9}
  .arch-box-accent{fill:rgba(47,111,237,.09);stroke:#2f6fed}
  .arch-box-good{fill:rgba(47,158,95,.10);stroke:#2f9e5f}
  .arch-box-warn{fill:rgba(201,138,46,.11);stroke:#c98a2e}
  .arch-box-bad{fill:rgba(217,83,79,.10);stroke:#d9534f}
  .arch-box-alt{fill:rgba(142,68,173,.09);stroke:#8e44ad}
  .arch-title{fill:#1a1c1f;font-size:13px;font-weight:600}
  .arch-sub{fill:#6b7280;font-size:10.5px}
  .arch-mono{fill:#6b7280;font-size:10.5px;font-family:ui-monospace,Consolas,monospace}
  .arch-cap{fill:#7d8490;font-size:10px}
  .arch-lane{fill:#6b7280;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
  .arch-line{stroke:#6b7280;fill:none;stroke-width:1.5}
  .arch-line-soft{stroke:#e3e5e9;fill:none;stroke-width:1.5}
  .arch-arrowhead{fill:#6b7280}
  .arch-group{fill:none;stroke:#e3e5e9;stroke-dasharray:4 4}
</style><rect x="86" y="46" width="900" height="122" rx="12" class="arch-group"></rect><text x="18" y="96" class="arch-lane">encoder</text><rect x="86" y="316" width="900" height="122" rx="12" class="arch-group"></rect><text x="18" y="366" class="arch-lane">decoder</text><g><rect x="102" y="60" width="196" height="88" rx="10" class="arch-box-accent"></rect><text x="200" y="84" text-anchor="middle" class="arch-title">Paper text from cache</text><text x="200" y="102" text-anchor="middle" class="arch-sub">full text, not the abstract</text><text x="200" y="117" text-anchor="middle" class="arch-mono">≤ 1,024 BPE tokens</text><text x="200" y="132" text-anchor="middle" class="arch-sub">vocab 50,265</text></g><g><path d="M 298 104 L 326 104" class="arch-line"></path><path d="M 326 104 L 317.6 98 L 317.6 110 Z" class="arch-arrowhead"></path></g><g><rect x="326" y="60" width="160" height="88" rx="10" class="arch-box"></rect><text x="406" y="84" text-anchor="middle" class="arch-title">Embeddings</text><text x="406" y="102" text-anchor="middle" class="arch-sub">token + learned position</text><text x="406" y="117" text-anchor="middle" class="arch-sub">no segment ids</text><text x="406" y="132" text-anchor="middle" class="arch-mono">→ 768-d</text></g><g><path d="M 486 104 L 514 104" class="arch-line"></path><path d="M 514 104 L 505.6 98 L 505.6 110 Z" class="arch-arrowhead"></path></g><g><rect x="523" y="51" width="206" height="88" rx="10" class="arch-box" opacity="0.45"></rect><rect x="518.5" y="55.5" width="206" height="88" rx="10" class="arch-box" opacity="0.7"></rect><rect x="514" y="60" width="206" height="88" rx="10" class="arch-box"></rect><text x="617" y="84" text-anchor="middle" class="arch-title">Encoder block</text><text x="617" y="102" text-anchor="middle" class="arch-sub">bidirectional self-attention</text><text x="617" y="117" text-anchor="middle" class="arch-sub">12 heads · FFN 3,072</text><text x="617" y="132" text-anchor="middle" class="arch-sub">GELU</text><g><rect x="678" y="49" width="38" height="20" rx="10" class="arch-box"></rect><text x="697" y="63" text-anchor="middle" class="arch-title" style="font-size:11px;">× 6</text></g></g><g><rect x="768" y="60" width="204" height="88" rx="10" class="arch-box-muted"></rect><text x="870" y="84" text-anchor="middle" class="arch-title">Serves two agents</text><text x="870" y="102" text-anchor="middle" class="arch-sub">Extractor: paper → summary</text><text x="870" y="117" text-anchor="middle" class="arch-sub">Writer: summaries → section</text><text x="870" y="132" text-anchor="middle" class="arch-sub">same weights, different prompt</text></g><g><path d="M 617 148 L 617 210" class="arch-line"></path><path d="M 617 210 L 611 201.6 L 623 201.6 Z" class="arch-arrowhead"></path></g><g><rect x="512" y="210" width="210" height="62" rx="10" class="arch-box-accent"></rect><text x="617" y="234" text-anchor="middle" class="arch-title">Encoder memory</text><text x="617" y="252" text-anchor="middle" class="arch-mono">one 768-d vector per token</text></g><g><path d="M 617 272 L 617 328" class="arch-line" stroke-dasharray="5 4"></path><path d="M 617 328 L 611 319.6 L 623 319.6 Z" class="arch-arrowhead"></path></g><text x="634" y="304" class="arch-cap">cross-attention, every decoder layer</text><g><rect x="102" y="330" width="196" height="88" rx="10" class="arch-box"></rect><text x="200" y="354" text-anchor="middle" class="arch-title">Summary so far</text><text x="200" y="372" text-anchor="middle" class="arch-mono">shifted right</text><text x="200" y="387" text-anchor="middle" class="arch-sub">teacher forcing in training</text><text x="200" y="402" text-anchor="middle" class="arch-sub">beam search at inference</text></g><g><path d="M 298 374 L 326 374" class="arch-line"></path><path d="M 326 374 L 317.6 368 L 317.6 380 Z" class="arch-arrowhead"></path></g><g><rect x="326" y="330" width="160" height="88" rx="10" class="arch-box"></rect><text x="406" y="354" text-anchor="middle" class="arch-title">Embeddings</text><text x="406" y="372" text-anchor="middle" class="arch-sub">token + learned position</text><text x="406" y="387" text-anchor="middle" class="arch-mono">→ 768-d</text></g><g><path d="M 486 374 L 514 374" class="arch-line"></path><path d="M 514 374 L 505.6 368 L 505.6 380 Z" class="arch-arrowhead"></path></g><g><rect x="523" y="321" width="206" height="88" rx="10" class="arch-box" opacity="0.45"></rect><rect x="518.5" y="325.5" width="206" height="88" rx="10" class="arch-box" opacity="0.7"></rect><rect x="514" y="330" width="206" height="88" rx="10" class="arch-box"></rect><text x="617" y="354" text-anchor="middle" class="arch-title">Decoder block</text><text x="617" y="372" text-anchor="middle" class="arch-sub">masked self-attention</text><text x="617" y="387" text-anchor="middle" class="arch-sub">cross-attention → memory</text><text x="617" y="402" text-anchor="middle" class="arch-sub">12 heads · FFN 3,072</text><g><rect x="678" y="319" width="38" height="20" rx="10" class="arch-box"></rect><text x="697" y="333" text-anchor="middle" class="arch-title" style="font-size:11px;">× 6</text></g></g><g><path d="M 720 374 L 748 374" class="arch-line"></path><path d="M 748 374 L 739.6 368 L 739.6 380 Z" class="arch-arrowhead"></path></g><g><rect x="748" y="330" width="224" height="88" rx="10" class="arch-box-good"></rect><text x="860" y="354" text-anchor="middle" class="arch-title">LM head</text><text x="860" y="372" text-anchor="middle" class="arch-sub">tied to the token embedding</text><text x="860" y="387" text-anchor="middle" class="arch-sub">768 → 50,265</text><text x="860" y="402" text-anchor="middle" class="arch-sub">generated summary</text></g></svg>