.6 98 L 669.6 110 Z" class="arch-arrowhead"></path></g><g><rect x="678" y="60" width="140" height="88" rx="10" class="arch-box"></rect><text x="748" y="84" text-anchor="middle" class="arch-title">[CLS] pooling</text><text x="748" y="102" text-anchor="middle" class="arch-sub">first token</text><text x="748" y="117" text-anchor="middle" class="arch-mono">384-d vector</text></g><g><path d="M 818 104 L 848 104" class="arch-line"></path><path d="M 848 104 L 839.6 98 L 839.6 110 Z" class="arch-arrowhead"></path></g><g><rect x="848" y="60" width="138" height="88" rx="10" class="arch-box-good"></rect><text x="917" y="84" text-anchor="middle" class="arch-title">Linear 384 → 1</text><text x="917" y="102" text-anchor="middle" class="arch-sub">relevance logit</text><text x="917" y="117" text-anchor="middle" class="arch-sub">sorts the pool</text><text x="917" y="132" text-anchor="middle" class="arch-sub">1 in 10 retained</text></g><path d="M 550 148 V 176 H 300 V 214" class="arch-line" stroke-dasharray="5 4" fill="none"></path><path d="M 300 214 L 294 202 L 306 202 Z" class="arch-arrowhead"></path><rect x="96" y="216" width="808" height="146" rx="12" class="arch-group"></rect><text x="112" y="238" class="arch-lane">one encoder layer</text><g><rect x="118" y="252" width="182" height="74" rx="10" class="arch-box-muted"></rect><text x="209" y="276" text-anchor="middle" class="arch-title">Multi-head attention</text><text x="209" y="294" text-anchor="middle" class="arch-sub">12 heads, 32 dims each</text><text x="209" y="309" text-anchor="middle" class="arch-sub">query ↔ abstract</text></g><g><path d="M 300 289 L 326 289" class="arch-line"></path><path d="M 326 289 L 317.6 283 L 317.6 295 Z" class="arch-arrowhead"></path></g><g><rect x="326" y="252" width="146" height="74" rx="10" class="arch-box-muted"></rect><text x="399" y="276" text-anchor="middle" class="arch-title">Add &amp; LayerNorm</text><text x="399" y="294" text-anchor="middle" class="arch-sub">residual</text></g><g><path d="M 472 289 L 498 289" class="arch-line"></path><path d="M 498 289 L 489.6 283 L 489.6 295 Z" class="arch-arrowhead"></path></g><g><rect x="498" y="252" width="182" height="74" rx="10" class="arch-box-muted"></rect><text x="589" y="276" text-anchor="middle" class="arch-title">Feed-forward</text><text x="589" y="294" text-anchor="middle" class="arch-sub">384 → 1536 → 384</text><text x="589" y="309" text-anchor="middle" class="arch-sub">GELU</text></g><g><path d="M 680 289 L 706 289" class="arch-line"></path><path d="M 706 289 L 697.6 283 L 697.6 295 Z" class="arch-arrowhead"></path></g><g><rect x="706" y="252" width="146" height="74" rx="10" class="arch-box-muted"></rect><text x="779" y="276" text-anchor="middle" class="arch-title">Add &amp; LayerNorm</text><text x="779" y="294" text-anchor="middle" class="arch-sub">residual</text></g><path d="M 118 336 V 348 H 399 V 330" class="arch-line-soft" fill="none"></path><path d="M 498 336 V 348 H 779 V 330" class="arch-line-soft" fill="none"></path><text x="399" y="360" text-anchor="middle" class="arch-cap">residual</text><text x="779" y="360" text-anchor="middle" class="arch-cap">residual</text></svg>